server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 모드 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 → API Gateway
    location /api {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OIDC logout is not routed by the bundled Gateway, so send it directly to
    # the Auth Server while keeping the browser on the frontend origin.
    location /connect/ {
        proxy_pass http://auth-server:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # JSESSIONID is HttpOnly and shared by localhost ports. Expire it from the
    # frontend origin so logout never silently reuses the previous Auth session.
    location = /kill-session {
        add_header Set-Cookie "JSESSIONID=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
