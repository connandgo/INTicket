
services:

  # Infrastructure

  mariadb:
    image: mariadb:11.2
    container_name: lecturedb
    environment:
      MYSQL_ROOT_PASSWORD: SqlDba-1
      MYSQL_DATABASE: lecture_db
      MYSQL_USER: manager
      MYSQL_PASSWORD: SqlDba-1
    ports:
      - "3379:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lecture-net

  # docker-entrypoint-initdb.d only runs on an empty volume. This one-shot service
  # applies the same idempotent schema/grant/seed script to retained volumes too.
  db-migration:
    image: mariadb:11.2
    container_name: lecture-db-migration
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: SqlDba-1
    volumes:
      - ./init-db:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - mariadb --host=mariadb --user=root --password="$${MARIADB_ROOT_PASSWORD}" < /migrations/01_init.sql
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - lecture-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: lecture-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lecture-net


  # Service Discovery

  eureka-server:
    image: inticket/eureka-server:secondary
    build:
      context: .
      dockerfile: Dockerfile.java-services
      target: eureka-server
    container_name: lecture-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_SERVER_RESPONSE_CACHE_UPDATE_INTERVAL_MS=1000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lecture-net


  # Auth Server

  auth-server:
    image: msa-lecture/auth-server:1.0
    pull_policy: never
    container_name: lecture-auth
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS=5
    depends_on:
      db-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - lecture-net


  # API Gateway

  api-gateway:
    image: msa-lecture/api-gateway:1.0
    pull_policy: never
    container_name: lecture-gateway
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS=5
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    healthcheck:
      # A process-only healthcheck allowed the frontend to start while the Gateway
      # still had an empty Eureka cache. JWK succeeds only after auth routing works.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/oauth2/jwks"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - lecture-net

  # Browser-facing edge. API behavior stays in the prebuilt Gateway; this layer
  # only keeps its Spring login page visually consistent with the Vue frontend.
  api-edge:
    # Reuse the frontend's locally built Nginx image so `up` never needs an
    # additional registry pull after `docker compose build`.
    image: inticket/frontend:secondary
    container_name: lecture-api-edge
    ports:
      - "8080:80"
    volumes:
      - ./infra/api-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/auth-login.css:/usr/share/nginx/html/auth-login.css:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/oauth2/jwks"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lecture-net


  # Microservices

  user-service:
    image: inticket/user-service:secondary
    build:
      context: .
      dockerfile: Dockerfile.java-services
      target: user-service
    container_name: lecture-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
    depends_on:
      db-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net
    restart: on-failure:3

  course-service:
    image: inticket/course-service:secondary
    build:
      context: .
      dockerfile: Dockerfile.java-services
      target: course-service
    container_name: lecture-course
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/performance_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
    depends_on:
      db-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/courses"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: on-failure:3

  enrollment-service:
    image: inticket/enrollment-service:secondary
    build:
      context: .
      dockerfile: Dockerfile.java-services
      target: enrollment-service
    container_name: lecture-enrollment
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/booking_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - COURSE_SERVICE_URL=http://course-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8084
    depends_on:
      db-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      course-service:
        condition: service_healthy
      payment-service:
        condition: service_started
    networks:
      - lecture-net
    restart: on-failure:3

  payment-service:
    image: inticket/payment-service:secondary
    build:
      context: .
      dockerfile: Dockerfile.java-services
      target: payment-service
    container_name: lecture-payment
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/payment_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      db-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - lecture-net
    restart: on-failure:3

  frontend:
    image: inticket/frontend:secondary
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
    container_name: lecture-frontend
    ports:
      - "3000:80"
    depends_on:
      api-edge:
        condition: service_healthy
      course-service:
        condition: service_healthy
    networks:
      - lecture-net


# Volumes & Networks

volumes:
  mariadb_data:
  kafka_data:

networks:
  lecture-net:
    driver: bridge
