server {
    listen 80;
    server_name _;

    # Prebuilt auth-server의 Spring 기본 로그인 화면을 INTicket UI로 맞춘다.
    location = /default-ui.css {
        alias /usr/share/nginx/html/auth-login.css;
        default_type text/css;
        add_header Cache-Control "no-store";
    }

    location = /login {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter '<html lang="en">' '<html lang="ko">';
        sub_filter '<title>Please sign in</title>' '<title>INTicket 로그인</title>';
        sub_filter '<div class="content">' '<div class="content"><aside class="login-side"><p class="side-kicker">INTICKET MEMBERSHIP</p><h1>보고 싶은 무대를<br>놓치지 마세요</h1><p class="side-copy">예매와 취소표 대기, 결제 내역을 하나의 계정으로 관리합니다.</p><ul><li>좌석 등급별 실시간 잔여 확인</li><li>10분 좌석 선점과 안전한 모의 결제</li><li>매진 공연 취소표 자동 매칭</li></ul></aside>';
        sub_filter '<h2>Please sign in</h2>' '<div class="login-brand"><span>IN</span><strong>티켓</strong></div><h2>로그인</h2><p class="login-lead">INTicket 계정으로 공연 예매를 시작하세요.</p>';
        sub_filter '>Username</label>' '>이메일</label>';
        sub_filter '>Password</label>' '>비밀번호</label>';
        sub_filter 'placeholder="Username"' 'placeholder="이메일" autocomplete="username"';
        sub_filter 'placeholder="Password"' 'placeholder="비밀번호" autocomplete="current-password"';
        sub_filter '>Sign in</button>' '>로그인</button>';
        sub_filter 'Bad credentials' '이메일 또는 비밀번호를 확인해 주세요.';
    }

    # API/OIDC 경로는 원본 Gateway로 그대로 전달한다.
    location / {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
